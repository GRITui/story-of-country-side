; export_presets.cfg for "Story of Country Side"
; Target engine: Godot 4.3-stable (GL Compatibility renderer).
; Install export templates once via the editor or `--export-*` before building.
; Export templates are NOT committed to the repository.
;
; Web threading decision: this preset ships THREADLESS (variant/thread_support=false).
; A threadless build avoids SharedArrayBuffer and the required COOP/COEP response
; headers, so the same export works on any static host (GitHub Pages, itch.io,
; plain `python3 -m http.server`, the Playwright webServer in playwright.config.ts).
; Enable variant/thread_support only if you control the hosting headers AND accept
; the browser support trade-offs (main-thread audio, no multithreaded physics).
;
; Exclude filter: keep build artifacts out of the export (import cache, tooling,
; tests, marketing/media). Both res://-prefixed and bare globs are honored by 4.3.

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="res://.godot/*,res://node_modules/*,res://tests/*,res://artifacts/*,res://marketing/*,res://content/*"
export_path="export/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
version="1.0"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

