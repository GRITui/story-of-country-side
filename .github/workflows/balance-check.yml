name: Balance Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3-stable
          use-dotnet: false
      - name: Run balance regression test (PO-16BIT-QA-6 #172)
        run: npm run check:balance